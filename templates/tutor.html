{% extends "base.html" %}

{% block extra_head %}
<link rel="stylesheet" href="{{ static_url('css/tutor.css') }}">
{% endblock %}

{% block content %}
<section class="card tutor">
    <h2>¡Leamos juntos!</h2>
    <p class="info">Elige tu edad y, si quieres, un tema. Lee el cuento y responde las preguntas.</p>
    <p id="mode-note" class="mode-note" hidden></p>

    <form id="story-form" class="tutor-form">
        <label class="field">
            <span>Mi edad</span>
            <select id="age">
                {% for a in range(5, 11) %}
                <option value="{{ a }}" {% if a == 7 %}selected{% endif %}>{{ a }} años</option>
                {% endfor %}
            </select>
        </label>
        <label class="field">
            <span>¿De qué quieres el cuento? (opcional)</span>
            <input id="interest" maxlength="60" placeholder="Por ejemplo: dinosaurios, perros, el mar">
        </label>
        <button id="story-btn" class="btn btn-primary big" type="submit">Crear cuento</button>
    </form>

    <p id="loading" class="loading" hidden>Preparando tu cuento...</p>
    <div id="error" class="alert alert-error" role="alert" hidden></div>

    <article id="story" hidden>
        <div class="story-header">
            <h3 id="story-title"></h3>
            <button id="listen" class="btn btn-small" type="button">🔊 Escuchar</button>
        </div>
        <div id="story-text" class="story-text"></div>
    </article>

    <section id="quiz" hidden>
        <p id="progress" class="progress"></p>
        <h3 id="question"></h3>
        <form id="answer-form" class="tutor-form">
            <input id="answer" maxlength="300" placeholder="Escribe tu respuesta" autocomplete="off" required>
            <button class="btn btn-primary" type="submit">Responder</button>
        </form>
        <p id="feedback" class="feedback" hidden></p>
        <p id="hint" class="hint" hidden></p>
        <p id="explanation" class="explanation" hidden></p>
        <button id="next" class="btn btn-secondary big" type="button" hidden>Siguiente pregunta</button>
    </section>

    <p id="done" class="done" hidden>¡Terminaste el cuento! ⭐ Crea otro cuando quieras.</p>
</section>

<script src="{{ static_url('js/tutor.js') }}"></script>
{% endblock %}
