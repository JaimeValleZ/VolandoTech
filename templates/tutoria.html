{% extends "base.html" %}

{% block extra_head %}
<link rel="stylesheet" href="{{ static_url('css/tutor.css') }}">
{% endblock %}

{% block content %}
<section class="card tutor">
    <h2>Tutoría personalizada</h2>
    <p class="info">El tutor te hace unas preguntas para conocerte y luego prepara una lectura hecha para ti.</p>
    <div id="error" class="alert alert-error" role="alert" hidden></div>

    <form id="start-form" class="tutor-form" hidden>
        <label class="field">
            <span>¿Cómo te llamas? (puedes usar un apodo)</span>
            <input id="nickname" maxlength="30" required>
        </label>
        <label class="field">
            <span>Tu edad</span>
            <select id="age">
                {% for a in range(5, 11) %}
                <option value="{{ a }}" {% if a == 7 %}selected{% endif %}>{{ a }} años</option>
                {% endfor %}
            </select>
        </label>
        <button class="btn btn-primary big" type="submit">Empezar</button>
    </form>

    <section id="chat" hidden>
        <div id="messages" class="messages" aria-live="polite"></div>
        <form id="chat-form" class="tutor-form">
            <input id="message" maxlength="300" placeholder="Escribe tu respuesta" autocomplete="off" required>
            <button class="btn btn-primary" type="submit">Enviar</button>
        </form>
    </section>

    <div id="ready" hidden>
        <button id="prepare" class="btn btn-primary big" type="button">Preparar mi tutoría</button>
        <p id="prepare-note" class="info" hidden>Preparando tu lectura… puede tardar unos segundos.</p>
    </div>

    <article id="story" hidden>
        <div class="story-header">
            <h3 id="story-title"></h3>
            <span id="source" class="badge"></span>
            <button id="listen" class="btn btn-small" type="button" hidden>🔊 Escuchar cuento</button>
        </div>
        <div id="story-text" class="story-text"></div>
    </article>

    <section id="quiz" hidden>
        <p id="progress" class="progress"></p>
        <div class="question-row">
            <h3 id="question"></h3>
            <button id="listen-question" class="btn btn-small" type="button" hidden>🔊 Escuchar pregunta</button>
        </div>
        <form id="answer-form" class="tutor-form">
            <input id="answer" maxlength="300" placeholder="Escribe tu respuesta" autocomplete="off" required>
            <button class="btn btn-primary" type="submit">Responder</button>
        </form>
        <p id="feedback" class="feedback" hidden></p>
        <p id="hint" class="hint" hidden></p>
        <p id="explanation" class="explanation" hidden></p>
        <button id="next" class="btn btn-secondary big" type="button" hidden>Siguiente pregunta</button>
    </section>

    <p id="done" class="done" hidden>¡Terminaste tu tutoría! ⭐</p>
    <p class="restart"><button id="restart" class="btn btn-small" type="button">Empezar de nuevo</button></p>
</section>

<script src="{{ static_url('js/tutoria.js') }}"></script>
{% endblock %}
